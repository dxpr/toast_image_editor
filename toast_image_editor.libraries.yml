fabric-js:
  version: 4.4.0
  js:
    https://cdnjs.cloudflare.com/ajax/libs/fabric.js/4.4.0/fabric.js: { type: external, minified: true }

tui-code-snippet:
  version: 1.5.0
  js:
    https://uicdn.toast.com/tui.code-snippet/v1.5.0/tui-code-snippet.min.js: { type: external, minified: true }

tui-color-picker:
  version: 2.2.6
  js:
    https://uicdn.toast.com/tui-color-picker/v2.2.6/tui-color-picker.js: { type: external, minified: true }
  css:
    theme:
      https://uicdn.toast.com/tui-color-picker/v2.2.6/tui-color-picker.css: { type: external, minified: true }
  dependencies:
    - toast_image_editor/tui-code-snippet

file-saver:
  version: 1.3.3
  js:
    https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/1.3.3/FileSaver.min.js: { type: external, minified: true }

toast-ui-image-editor:
  version: latest
  js:
    https://uicdn.toast.com/tui-image-editor/latest/tui-image-editor.js: { type: external, minified: true }
  css:
    theme:
      https://uicdn.toast.com/tui-image-editor/latest/tui-image-editor.css: { type: external, minified: true }
  dependencies:
    - toast_image_editor/fabric-js
    - toast_image_editor/tui-color-picker
    - toast_image_editor/file-saver
    - core/drupal
    - core/drupalSettings

toast-image-editor-integration:
  js:
    js/toast-image-editor.js: {}
  css:
    theme:
      css/toast-image-editor.css: {}
  dependencies:
    - toast_image_editor/toast-ui-image-editor
    - core/once

toast-image-editor-settings:
  css:
    theme:
      css/toast-image-editor-settings.css: {}