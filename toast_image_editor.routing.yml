toast_image_editor.media_save:
  path: '/media/{media}/save-image'
  defaults:
    _controller: '\Drupal\toast_image_editor\Controller\ImageEditorController::save'
  requirements:
    _permission: 'edit media images'
    _entity_access: 'media.update'
    _method: 'POST'
    media: \d+
  options:
    parameters:
      media:
        type: entity:media

toast_image_editor.settings:
  path: '/admin/config/media/toast-image-editor'
  defaults:
    _form: '\Drupal\toast_image_editor\Form\SettingsForm'
    _title: 'Toast Image Editor Settings'
  requirements:
    _permission: 'administer toast image editor'